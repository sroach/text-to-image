<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-Image-Turbo</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #a1a1aa;
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 960px;
    width: 100%;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: .25rem;
  }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: .95rem; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
  }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: .35rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  textarea, input, select {
    width: 100%;
    padding: .65rem .8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: .95rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  textarea:focus, input:focus, select:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 100px; }
  .field { margin-bottom: 1rem; }
  .row {
    display: flex;
    gap: .75rem;
  }
  .row .field { flex: 1; }
  button {
    width: 100%;
    padding: .75rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .preview img {
    max-width: 100%;
    max-height: 100%;
    display: block;
    border-radius: var(--radius);
  }
  .placeholder {
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
    padding: 1rem;
  }
  .spinner {
    display: none;
    width: 40px; height: 40px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta {
    margin-top: .75rem;
    font-size: .85rem;
    color: var(--muted);
  }
  .meta span { color: var(--text); font-weight: 600; }
  .download-btn {
    display: inline-block;
    margin-top: .5rem;
    padding: .4rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--accent);
    text-decoration: none;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .download-btn:hover { border-color: var(--accent); }
  .note {
    font-size: .78rem;
    color: var(--muted);
    margin-top: .25rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 Z-Image-Turbo</h1>
  <p class="subtitle">Text-to-image generation on your Mac — powered by mflux + MLX (32 GB+ RAM)</p>

  <div class="grid">
    <!-- Left: Controls -->
    <div>
      <div class="field">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Describe the image you want to generate…">A serene mountain lake at sunset, mirror-like reflections, golden light, photorealistic, 8k</textarea>
      </div>

      <div class="field">
        <label for="negative_prompt">Negative Prompt</label>
        <input id="negative_prompt" placeholder="Things to avoid (e.g. blurry, watermark)" />
        <p class="note">Z-Image-Turbo ignores CFG at inference — constraints are best placed in the positive prompt.</p>
      </div>

      <div class="row">
        <div class="field">
          <label for="width">Width</label>
          <input id="width" type="number" value="1024" min="256" max="2048" step="16" />
        </div>
        <div class="field">
          <label for="height">Height</label>
          <input id="height" type="number" value="1024" min="256" max="2048" step="16" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="steps">Steps</label>
          <input id="steps" type="number" value="9" min="1" max="30" />
        </div>
        <div class="field">
          <label for="seed">Seed</label>
          <input id="seed" type="number" placeholder="Random" min="0" />
        </div>

        <div class="field">
          <label for="filename">Filename</label>
          <input id="filename" placeholder="e.g. my-image (auto if empty)" />
        </div>
      </div>

      <div class="field">
        <label>Presets</label>
        <div class="row" style="flex-wrap:wrap">
          <button style="flex:1;padding:.45rem;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="setSize(1024,1024)">1:1</button>
          <button style="flex:1;padding:.45rem;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="setSize(1280,768)">16:9</button>
          <button style="flex:1;padding:.45rem;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="setSize(768,1280)">9:16</button>
          <button style="flex:1;padding:.45rem;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="setSize(1024,1536)">2:3</button>
        </div>
      </div>

      <button id="generate_btn" onclick="generate()">Generate Image</button>
    </div>

    <!-- Right: Preview -->
    <div>
      <div class="preview" id="preview">
        <p class="placeholder" id="placeholder">Your generated image will appear here.</p>
        <div class="spinner" id="spinner"></div>
        <img id="result_img" style="display:none" alt="Generated image" />
      </div>
      <div class="meta" id="meta"></div>
      <a class="download-btn" id="download_btn" style="display:none" download>⬇ Download PNG</a>
    </div>
  </div>
</div>

<script>
function setSize(w, h) {
  document.getElementById('width').value = w;
  document.getElementById('height').value = h;
}

async function generate() {
  const btn = document.getElementById('generate_btn');
  const spinner = document.getElementById('spinner');
  const placeholder = document.getElementById('placeholder');
  const img = document.getElementById('result_img');
  const meta = document.getElementById('meta');
  const dl = document.getElementById('download_btn');

  const payload = {
    prompt: document.getElementById('prompt').value.trim(),
    negative_prompt: document.getElementById('negative_prompt').value.trim(),
    width: parseInt(document.getElementById('width').value),
    height: parseInt(document.getElementById('height').value),
    num_inference_steps: parseInt(document.getElementById('steps').value),
  };
  const seedVal = document.getElementById('seed').value.trim();
  if (seedVal) payload.seed = parseInt(seedVal);
  const filenameVal = document.getElementById('filename').value.trim();
  if (filenameVal) payload.filename = filenameVal;

  if (!payload.prompt) { alert('Please enter a prompt.'); return; }

  btn.disabled = true;
  btn.textContent = 'Generating…';
  spinner.style.display = 'block';
  placeholder.style.display = 'none';
  img.style.display = 'none';
  meta.innerHTML = '';
  dl.style.display = 'none';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Generation failed');
    }
    const data = await res.json();

    img.src = 'data:image/png;base64,' + data.base64;
    img.style.display = 'block';
    meta.innerHTML = `Seed: <span>${data.seed}</span> &middot; Time: <span>${data.elapsed_seconds}s</span> &middot; Size: <span>${data.width}×${data.height}</span>`;
    dl.href = data.url;
    dl.style.display = 'inline-block';
  } catch (e) {
    placeholder.textContent = '❌ ' + e.message;
    placeholder.style.display = 'block';
  } finally {
    spinner.style.display = 'none';
    btn.disabled = false;
    btn.textContent = 'Generate Image';
  }
}
</script>
</body>
</html>
